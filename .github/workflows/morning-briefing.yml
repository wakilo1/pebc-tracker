name: PEBC Morning Briefing

on:
  schedule:
    - cron: '14 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Exécution du Briefing Matinal
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        ACTION_TYPE: briefing
      run: node tracker.js
    - name: Mise à jour du Dashboard GitHub
      run: |
        git config --global user.name "Zipi Bot"
        git config --global user.email "zipi@bot.com"
        git add README.md
        git commit -m "Mise à jour quotidienne du Dashboard" || echo "Rien à mettre à jour"
        git push
